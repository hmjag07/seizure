# Shared settings for all pipeline steps. Override per experiment in configs/<name>.yaml.
seed: 42

data:
  dataset: seizeit2          # seizeit2 | chbmit
  pilot_patients: []         # filled in after label scan (Step 1.2)
  cache_dir: cache

windows:
  hop_s: 1
  length_s: {eeg: 4, emg: 4, mov: 4, ecg: 15}

faults:
  types: [pop, decline, dropout]
  severities: [0, 0.25, 0.5, 0.75, 1.0]

tda:
  embedding_dim: null        # chosen by false nearest neighbours on training data
  delay: null                # chosen by mutual information on training data
  n_points: 300
  homology_dims: [0, 1]

alarm:
  threshold: 0.5
  x_of_y: [8, 10]
