# Shared settings for all pipeline steps. Override per experiment in configs/<name>.yaml.
seed: 42

data:
  dataset: seizeit2          # seizeit2 | chbmit
  # 30 patients picked by seizure.data.pilot (seed 42); see docs/pipeline.md Step 1.2
  pilot_patients: [
    sub-002, sub-004, sub-015, sub-021, sub-022, sub-025,
    sub-031, sub-034, sub-035, sub-039, sub-040, sub-043,
    sub-046, sub-055, sub-056, sub-060, sub-064, sub-066,
    sub-067, sub-071, sub-072, sub-076, sub-077, sub-079,
    sub-080, sub-084, sub-086, sub-089, sub-092, sub-094
  ]
  cache_dir: cache

windows:
  hop_s: 1
  length_s: {eeg: 4, emg: 4, mov: 4, ecg: 15}

faults:
  types: [pop, decline, dropout]
  severities: [0, 0.25, 0.5, 0.75, 1.0]

tda:
  # Delay and dimension are chosen per signal on training data (false nearest neighbours,
  # mutual information) and stored in results/tables/tda_params.csv.
  params_file: results/tables/tda_params.csv
  n_points: 150              # 300 was too slow (docs/pipeline.md Step 4A)
  homology_dims: [0, 1]

alarm:
  threshold: 0.5
  fa_budget_per_h: 11          # success target T1
  select_budget_per_h: 8       # thresholds chosen at this rate on training patients (Phase A2)
  x_of_y: [5, 10]            # SeizeIT2 benchmark used 8 of 10; changed 2026-10-19 to catch short seizures
