[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seizure"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "xgboost",
    "ripser",
    "persim",
    "matplotlib",
]

[project.optional-dependencies]
cnn = ["torch"]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
